<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dino Ripper" />
    <meta name="theme-color" content="#071216" />
    <title>Dino Ripper</title>
    <meta
      name="description"
      content="Rip open packs of dinosaur cards and fill your binder: 100 cards drawn by 22 artists, from crayon commons to the gold T. rex."
    />
    <link rel="icon" href="./favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <!-- Link previews. %SITE_URL% is filled in by the build (see vite.config.ts), because
         these have to be full addresses. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dino Ripper" />
    <meta property="og:title" content="Dino Ripper" />
    <meta
      property="og:description"
      content="Rip open packs of dinosaur cards and fill your binder: 100 cards drawn by 22 artists, from crayon commons to the gold T. rex."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Dino Ripper logo over five dinosaur cards, each drawn in a different style." />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="bg"></div>
    <img id="brand" src="./art/logo.webp" alt="Dino Ripper" draggable="false" />
    <div id="hint"></div>
    <div id="arrow"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M6 24h26V8l28 24-28 24V40H6z" /></svg></div>
    <button id="trade-top" class="trade" type="button">Trade duplicates for the remaining cards</button>
    <div id="tip">Tap a card for a closer look</div>
    <div id="table"></div>
    <canvas id="packs"></canvas>
    <button id="next" type="button">Next Pack</button>
    <label id="auto"><input type="checkbox" /><i></i><span>Auto open next pack</span></label>
    <button id="binder-peek" type="button" aria-label="Open collection">
      <span class="peek-cover"></span>
      <span class="peek-count"></span>
    </button>
    <div id="celebrate"><div class="rays"></div></div>
    <div id="banner"></div>
    <button id="tap" type="button">Tap to sleeve</button>
    <div id="binder"></div>
    <div id="gained"></div>
    <div id="zoom"></div>
    <canvas id="fx"></canvas>
    <button id="mute" type="button" aria-label="Sound on or off"></button>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
